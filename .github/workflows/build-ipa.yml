name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app for device (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "Pocket Snes.xcodeproj" \
            -scheme "Pocket Snes" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/dd/Build/Products -type d -name "*.app" -not -path "*/Intermediates.noindex/*" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry ../Pocket-Snes.ipa Payload
          cd ../..
          ls -lh build/Pocket-Snes.ipa

      - name: Upload IPA as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Snes-ipa
          path: build/Pocket-Snes.ipa
          if-no-files-found: error

      - name: Attach IPA to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Pocket-Snes.ipa
          generate_release_notes: true
